name: Build IPA

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="v0.0.0-dev"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build unsigned IPA
        run: scripts/build_ipa.sh MARKETING_VERSION=${{ steps.v.outputs.version }} CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: SendIt-${{ steps.v.outputs.version }}
          path: dist/SendIt.ipa

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.v.outputs.tag }}" dist/SendIt.ipa --clobber

      - name: Update AltStore source
        if: github.event_name == 'release'
        env:
          NOTES: ${{ github.event.release.body }}
        run: |
          python3 scripts/update_source.py "${{ steps.v.outputs.version }}" "${{ github.run_number }}" dist/SendIt.ipa "${NOTES:-SendIt ${{ steps.v.outputs.version }}}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          git commit -m "AltStore source: ${{ steps.v.outputs.tag }}" || exit 0
          git push origin HEAD:main
